substitutions:
  name: "word-clock"
  friendly_name: "Word Clock"
  project_name: "Skyex Technologies.Word Clock"
  project_version: "1.0.0"

esphome:
  name: "${name}"
  name_add_mac_suffix: true
  # Customers compile with their own dashboard's ESPHome version, which
  # requirements.txt does not control. Keep this in sync with that pin.
  min_version: 2026.9.1
  project:
    name: "${project_name}"
    version: "${project_version}"
  on_boot:
    priority: -10
    then:
      - light.turn_on:
          id: word_clock
      - script.execute:
          id: apply_timezone
          timezone_index: !lambda return id(timezone).active_index().value_or(0);

external_components:
  # Fetched from GitHub (not a local path) so configs adopted through
  # dashboard_import can find the component; a local path would resolve
  # against the customer's config folder, which has no components/ directory.
  - source: github://SkyexTechnologies/word-clock@main
    components: [wordclock_layout]

wordclock_layout:
  id: layout

esp8266:
  board: esp01_1m
  # Layout sector 250 and ESPHome preferences sector 251 are isolated by the
  # linker script supplied by components/wordclock_layout.
  restore_from_flash: true

logger:

api:
  services:
    - service: set_word_layout
      variables:
        flat_layout: int[]
      then:
        - lambda: |-
            if (!id(layout).write_layout_flat(flat_layout)) {
              ESP_LOGE("word_clock", "Failed to save word layout to EEPROM");
            }

ota:
  - platform: esphome

wifi:
  fast_connect: False
  ap: {}

captive_portal:

improv_serial:

web_server:
  port: 80
  local: True
  # Version 3 has a colour picker for the light, so the colour can be set
  # without Home Assistant.
  version: 3

dashboard_import:
  package_import_url: github://SkyexTechnologies/word-clock/word-clock.yaml@main
  import_full_config: False

time:
  # Home Assistant supplies both current time and its configured timezone over
  # the native API. With no explicit timezone here, HA's timezone is applied
  # dynamically when this source syncs.
  - platform: homeassistant
    id: homeassistant_time
    on_time_sync:
      then:
        # A manually selected zone takes precedence over HA's automatic zone.
        # Delay until the API handler has applied the timezone from HA.
        - if:
            condition:
              lambda: return id(timezone).active_index().value_or(0) > 0;
            then:
              - delay: 1s
              - script.execute:
                  id: apply_timezone
                  timezone_index: !lambda return id(timezone).active_index().value_or(0);
  - platform: sntp
    id: sntp_time

button:
  - platform: factory_reset
    id: factory_reset_button
    name: Factory Reset Word Clock
  - platform: restart
    id: restart_button
    name: Restart Word Clock

binary_sensor:
  - platform: gpio
    id: reset_button
    pin:
      number: GPIO0
      mode: INPUT_PULLUP
      inverted: True
    internal: true
    on_click:
      - min_length: 2s
        max_length: 5s
        then:
          - button.press: restart_button
      - min_length: 10s
        max_length: 20s
        then:
          - button.press: factory_reset_button
  # Off means the word layout in flash sector 250 is missing or corrupt, so
  # the clock runs its LED self-test until it is provisioned (see README).
  - platform: template
    id: layout_provisioned
    name: "Layout Provisioned"
    entity_category: diagnostic
    icon: "mdi:grid"
    lambda: return id(layout).is_provisioned();

select:
  - platform: template
    name: "06. Time Zone"
    id: timezone
    restore_value: True
    optimistic: True
    icon: "mdi:map-clock"
    # The selection is saved and applied by option index (see the switch in
    # the apply_timezone script). Only append new zones at the end, and update
    # apply_timezone to match; never insert, remove or reorder options, or
    # customers' saved time zone changes after an update.
    options:
      - "Home Assistant / build default"
      - "UTC (UTC+00:00)"
      - "Amsterdam (UTC+01:00 / UTC+02:00 DST)"
      - "London (UTC+00:00 / UTC+01:00 DST)"
      - "New York (UTC-05:00 / UTC-04:00 DST)"
      - "Chicago (UTC-06:00 / UTC-05:00 DST)"
      - "Denver (UTC-07:00 / UTC-06:00 DST)"
      - "Los Angeles (UTC-08:00 / UTC-07:00 DST)"
      - "Seoul, South Korea (UTC+09:00)"
      - "Sydney (UTC+10:00 / UTC+11:00 DST)"
    initial_option: "Home Assistant / build default"
    on_value:
      then:
        - script.execute:
            id: apply_timezone
            timezone_index: !lambda return id(timezone).active_index().value_or(0);

switch:
  - platform: template
    name: "03. Automatic Brightness"
    id: automatic_brightness
    optimistic: True
    restore_mode: RESTORE_DEFAULT_ON
    icon: "mdi:brightness-auto"
  - platform: template
    name: "07. Indication: It is"
    id: indication_it_is
    optimistic: True
    restore_mode: RESTORE_DEFAULT_ON
    icon: "mdi:file-word-box-outline"
  - platform: template
    name: "08. Indication: Minutes"
    id: indication_minutes
    optimistic: True
    restore_mode: RESTORE_DEFAULT_ON
    icon: "mdi:file-word-box-outline"
  - platform: template
    name: "09. Indication: Week Days"
    id: indication_week_days
    optimistic: True
    restore_mode: RESTORE_DEFAULT_ON
    icon: "mdi:file-word-box-outline"

script:
  - id: apply_timezone
    parameters:
      timezone_index: int
    then:
      - lambda: |-
          static esphome::time::ParsedTimezone build_timezone{};
          static bool build_timezone_captured = false;
          if (!build_timezone_captured) {
            build_timezone = esphome::time::get_global_tz();
            build_timezone_captured = true;
          }

          if (timezone_index == 0) {
            esphome::time::set_global_tz(build_timezone);
            return;
          }
          // Upper bound = last option index; raise it when appending a zone.
          if (timezone_index < 0 || timezone_index > 9) return;

          esphome::time::ParsedTimezone tz{};
          auto set_dst_rule = [](esphome::time::DSTRule &rule, uint8_t month,
                                 uint8_t week, int32_t time_seconds) {
            rule.type = esphome::time::DSTRuleType::MONTH_WEEK_DAY;
            rule.month = month;
            rule.week = week;
            rule.day_of_week = 0;  // Sunday
            rule.time_seconds = time_seconds;
          };

          switch (timezone_index) {
            case 1:  // UTC
              break;
            case 2:  // Europe/Amsterdam
              tz.std_offset_seconds = -3600;
              tz.dst_offset_seconds = -7200;
              set_dst_rule(tz.dst_start, 3, 5, 7200);
              set_dst_rule(tz.dst_end, 10, 5, 10800);
              break;
            case 3:  // Europe/London
              tz.dst_offset_seconds = -3600;
              set_dst_rule(tz.dst_start, 3, 5, 3600);
              set_dst_rule(tz.dst_end, 10, 5, 7200);
              break;
            case 4:  // America/New_York
              tz.std_offset_seconds = 18000;
              tz.dst_offset_seconds = 14400;
              set_dst_rule(tz.dst_start, 3, 2, 7200);
              set_dst_rule(tz.dst_end, 11, 1, 7200);
              break;
            case 5:  // America/Chicago
              tz.std_offset_seconds = 21600;
              tz.dst_offset_seconds = 18000;
              set_dst_rule(tz.dst_start, 3, 2, 7200);
              set_dst_rule(tz.dst_end, 11, 1, 7200);
              break;
            case 6:  // America/Denver
              tz.std_offset_seconds = 25200;
              tz.dst_offset_seconds = 21600;
              set_dst_rule(tz.dst_start, 3, 2, 7200);
              set_dst_rule(tz.dst_end, 11, 1, 7200);
              break;
            case 7:  // America/Los_Angeles
              tz.std_offset_seconds = 28800;
              tz.dst_offset_seconds = 25200;
              set_dst_rule(tz.dst_start, 3, 2, 7200);
              set_dst_rule(tz.dst_end, 11, 1, 7200);
              break;
            case 8:  // Asia/Seoul
              tz.std_offset_seconds = -32400;
              break;
            case 9:  // Australia/Sydney
              tz.std_offset_seconds = -36000;
              tz.dst_offset_seconds = -39600;
              set_dst_rule(tz.dst_start, 10, 1, 7200);
              set_dst_rule(tz.dst_end, 4, 1, 10800);
              break;
          }

          esphome::time::set_global_tz(tz);

  - id: set_light_brightness
    parameters:
      quick_transition: bool
    then:
      - if: 
          condition:
            and: 
              - switch.is_on: automatic_brightness
              - light.is_on: word_clock
              # The light sensor has no reading for up to 15 s after boot, but
              # the brightness numbers already call this script when they
              # restore. Skip until there is a reading instead of using NaN.
              - lambda: return !std::isnan(id(light_sensor).state);
          then:
            - light.control:
                id: word_clock
                transition_length: !lambda |-
                  if (quick_transition) 
                    return 500;
                  return 10000;
                brightness: !lambda |-
                  float min_brightness = id(minimum_brightness).state;
                  float max_brightness = id(maximum_brightness).state;
                  float sensor_reading = id(light_sensor).state;
                  float brightness = (max_brightness - min_brightness) * sensor_reading + min_brightness;
                  if (brightness > 1.0) {
                    brightness = 1.0;
                  }
                  if (brightness < 0.0) {
                    brightness = 0.0;
                  }
                  return brightness;

number:
  # Red/green/blue are hidden: the colour is set on the light itself. They
  # stay because they store the colour across reboots, and removing them
  # would shift the ESP8266 flash preferences (including the Wi-Fi
  # credentials, which are stored last).
  - platform: template
    name: "10. Red"
    id: red
    optimistic: True
    min_value: 0
    max_value: 1
    step: 0.01
    restore_value: True
    internal: True
    icon: "mdi:palette"
    on_value:
      then:
        - if:
            condition:
              - lambda: "return id(word_clock).remote_values.get_red() != x;"
            then:
              - light.control:
                  id: word_clock
                  red: !lambda "return x;"
                  green: !lambda "return id(green).state;"
                  blue: !lambda "return id(blue).state;"
  - platform: template
    name: "11. Green"
    id: green
    optimistic: True
    min_value: 0
    max_value: 1
    step: 0.01
    restore_value: True
    internal: True
    icon: "mdi:palette"
    on_value:
      then:
        - if:
            condition:
              - lambda: "return id(word_clock).remote_values.get_green() != x;"
            then:
              - light.control:
                  id: word_clock
                  red: !lambda "return id(red).state;"
                  green: !lambda "return x;"
                  blue: !lambda "return id(blue).state;"
  - platform: template
    name: "12. Blue"
    id: blue
    optimistic: True
    min_value: 0
    max_value: 1
    step: 0.01
    restore_value: True
    internal: True
    icon: "mdi:palette"
    on_value:
      then:
        - if:
            condition:
              - lambda: "return id(word_clock).remote_values.get_blue() != x;"
            then:
              - light.control:
                  id: word_clock
                  red: !lambda "return id(red).state;"
                  green: !lambda "return id(green).state;"
                  blue: !lambda "return x;"
  - platform: template
    name: "02. Transition"
    id: transition
    optimistic: True
    min_value: 0
    max_value: 10
    step: 1
    restore_value: True
    icon: "mdi:transition"
  - platform: template
    name: "04. Minimum Brightness"
    id: minimum_brightness
    optimistic: True
    min_value: 0.01
    max_value: 1
    step: 0.01
    restore_value: True
    icon: "mdi:brightness-4"
    on_value:
      - if: 
          condition:
            - lambda: "return id(maximum_brightness).state < x;"
          then:
            - number.set:
               id: maximum_brightness
               value: !lambda "return x;"
      - script.execute: 
          id: set_light_brightness
          quick_transition: True
  - platform: template
    name: "05. Maximum Brightness"
    id: maximum_brightness
    optimistic: True
    min_value: 0.01
    max_value: 1
    initial_value: 1
    step: 0.01
    restore_value: True  
    icon: "mdi:brightness-5"
    on_value:
      - if: 
          condition:
            - lambda: "return x < id(minimum_brightness).state;"
          then:
            - number.set:
               id: minimum_brightness
               value: !lambda "return x;"
      - script.execute: 
          id: set_light_brightness
          quick_transition: True
  - platform: template
    name: "Brightness"
    id: brightness
    optimistic: True
    min_value: 0.01
    max_value: 1
    initial_value: 1
    step: 0.01
    restore_value: True
    internal: True

sensor:
  - platform: adc
    pin: A0
    name: "Light Sensor"
    id: light_sensor
    update_interval: 15s
    internal: True
    on_value:
      - script.execute: 
          id: set_light_brightness
          quick_transition: False

light:
  - platform: neopixelbus
    type: GRB
    variant: WS2812X
    pin: GPIO2
    num_leds: 121
    name: "01. Word Clock"
    id: word_clock
    default_transition_length: 10s
    icon: "mdi:file-word-box-outline"
    on_state:
      then:
        - if:
            condition:
              and:
                - lambda: "return id(word_clock).get_effect_name() == \"None\";"
                - light.is_on: word_clock
            then:
              - delay: 10ms
              # Enforce the light effect to be at "Clock"
              - light.control:
                  id: word_clock
                  effect: Clock
        - if:
            condition:
              and:
                - lambda: "return id(word_clock).remote_values.get_red() != id(red).state;"
                - light.is_on: word_clock
            then:
              - number.set:
                  id: red
                  value: !lambda "return id(word_clock).remote_values.get_red();"
        - if:
            condition:
              and:
                - lambda: "return id(word_clock).remote_values.get_green() != id(green).state;"
                - light.is_on: word_clock
            then:
              - number.set:
                  id: green
                  value: !lambda "return id(word_clock).remote_values.get_green();"
        - if:
            condition:
              and:
                - lambda: "return id(word_clock).remote_values.get_blue() != id(blue).state;"
                - light.is_on: word_clock
            then:
              - number.set:
                  id: blue
                  value: !lambda "return id(word_clock).remote_values.get_blue();"
        - if: 
            condition:
              and: 
                - switch.is_off: automatic_brightness
                - lambda: "return id(word_clock).remote_values.get_brightness() != id(brightness).state;"
                - light.is_on: word_clock
            then:
              - number.set:
                  id: brightness
                  value: !lambda "return id(word_clock).remote_values.get_brightness();"

    on_turn_on:
      then:
        - if:
            condition:
              - switch.is_off: automatic_brightness
            then:
              - light.control: 
                  id: word_clock
                  effect: Clock
                  red: !lambda "return id(red).state;"
                  green: !lambda "return id(green).state;"
                  blue: !lambda "return id(blue).state;"
                  brightness: !lambda "return id(brightness).state;"
            else:
              - light.control: 
                  id: word_clock
                  effect: Clock
                  red: !lambda "return id(red).state;"
                  green: !lambda "return id(green).state;"
                  blue: !lambda "return id(blue).state;"
    effects:
      - addressable_lambda:
          name: "Clock"
          update_interval: 20ms
          lambda: |-
            static int minutes;
            static int hours;
            static int CurrentTime[5];
            static int PreviousTime[5];
            static int fade;
            static int fadeTransition;
            
            static Color letters[121];

            if (initial_run) {
              it.all() = Color::BLACK;
              std::fill_n(letters, it.size(), Color::BLACK);
              fade = int(25*id(transition).state);
              fadeTransition = int(25*id(transition).state);
            }

            /*
             * No valid word layout: run an LED self-test instead of the clock.
             * An unprovisioned clock is then visibly different from a broken
             * one, and every LED and colour channel can be checked before
             * provisioning. Needs no layout, Wi-Fi or time.
             * 1. All LEDs red, green, blue, white (1 s each).
             * 2. One white LED steps from 0 to 120 (100 ms each), logging its index.
             */
            if (!id(layout).is_provisioned()) {
              // 128 is about 14% PWM after gamma correction, which keeps the
              // supply current low with all LEDs on.
              static const uint8_t TEST_LEVEL = 128;
              static const uint32_t COLOUR_MS = 1000;
              static const uint32_t CHASE_MS = 100;
              static int last_led = -1;
              const Color colours[4] = {
                  Color(TEST_LEVEL, 0, 0), Color(0, TEST_LEVEL, 0),
                  Color(0, 0, TEST_LEVEL), Color(TEST_LEVEL, TEST_LEVEL, TEST_LEVEL)};

              const uint32_t solid_ms = 4 * COLOUR_MS;
              const uint32_t t = millis() % (solid_ms + it.size() * CHASE_MS);
              if (t < solid_ms) {
                it.all() = colours[t / COLOUR_MS];
                last_led = -1;
              } else {
                const int led = (t - solid_ms) / CHASE_MS;
                it.all() = Color::BLACK;
                it[led] = Color::WHITE;
                if (led != last_led) {
                  ESP_LOGD("led_test", "LED %d", led);
                  last_led = led;
                }
              }
              return;
            }

            auto time = id(sntp_time).now();
            if (!time.is_valid()) {
              return;
            }

            /*
             * Below is the transition control of the clock to change to the next time (next 5 minute section).
             * The update_interval is 20ms, which would mean that it takes 50 iterations in total to fade to the next time over a 1 second period.
             * This fade is divided into fading-out the old time (25 steps) and fading-in the new time (25 steps).
             * The transition slider specifies the number of seconds the total fade takes (id: transition).
             * The value of the transition is multiplied by 25 (steps) to create the fader.
             */
            auto trans = int(25*id(transition).state);
            if (trans != fadeTransition) {
              fade = trans;
              fadeTransition = trans;
            }

            int total_minutes = time.hour * 60 + time.minute;
            minutes = (int)(total_minutes / 5) * 5 % 60; // minutes per 5
            hours = total_minutes / 60;

            if (minutes >= 20) hours += 1;

            CurrentTime[0] = 0;
            CurrentTime[1] = minutes / 5 + 1;
            CurrentTime[2] = (hours % 12) + 13;
            CurrentTime[3] = time.day_of_week + 24;
            CurrentTime[4] = (total_minutes % 5) + 32;

            if (PreviousTime[1] == CurrentTime[1]) {
              std::fill_n(letters, it.size(), Color::BLACK);
              for (int i = 0; i < 5; i++) { 
                if (i == 0 && !id(indication_it_is).state) continue;
                if (i == 3 && !id(indication_week_days).state) continue;
                if (i == 4 && !id(indication_minutes).state) continue;
                for (int j = 0; j < 12; j++) {
                  int8_t led = id(layout).led_for(CurrentTime[i], j);
                  if (led >= 0) letters[led] = current_color;
                }
              }
            }

            if (!initial_run) {
              // Fade words from selected brightness down to zero, when time changes.
              if (PreviousTime[1] != CurrentTime[1] && fade > 0) {
                for (int i = 0; i < it.size(); i++) it[i] = Color(int(letters[i].r*fade/fadeTransition), int(letters[i].g*fade/fadeTransition), int(letters[i].b*fade/fadeTransition));
                fade--;
                return;
              }

              // Set previous time to current time, such that above code will not run again. 
              for (int i = 0; i < 5; i++) PreviousTime[i] = CurrentTime[i];
              
              // Now that new pixels for current time are known, slowly fade in the words.
              if (fade < fadeTransition) {
                for (int i = 0; i < it.size(); i++) it[i] = Color(int(letters[i].r*fade/fadeTransition), int(letters[i].g*fade/fadeTransition), int(letters[i].b*fade/fadeTransition));
                fade++;
                return;
              }
            }
              
            for (int i = 0; i < it.size(); i++) it[i] = letters[i];

            // Set previous time to current time, such that above code will not run again. 
            for (int i = 0; i < 5; i++) PreviousTime[i] = CurrentTime[i];